clamp(p.x-vw*.34,0,Math.max(0,W-vw))-cam)*Math.min(1,dt*5.5);msgT=Math.max(0,msgT-dt)}function cloud(a,b,z){x.fillStyle='#ffffffdd';x.beginPath();x.arc(a,b,z*.28,0,7);x.arc(a+z*.28,b-z*.12,z*.36,0,7);x.arc(a+z*.62,b,z*.3,0,7);x.fillRect(a,b,z*.65,z*.25);x.fill()}function bg(){let g=x.createLinearGradient(0,0,0,vh);g.addColorStop(0,'#62c7ff');g.addColorStop(.7,'#b8eeff');g.addColorStop(1,'#fff2c0');x.fillStyle=g;x.fillRect(0,0,vw,vh);x.fillStyle='#8dcf82';for(let i=-2;i<12;i++){let a=i*260-(cam*.16%260);x.beginPath();x.moveTo(a-100,620);x.quadraticCurveTo(a+35,370,a+190,620);x.fill()}x.fillStyle='#58ad69';for(let i=-2;i<10;i++){let a=i*360-(cam*.28%360);x.beginPath();x.moveTo(a-130,640);x.quadraticCurveTo(a+60,410,a+250,640);x.fill()}cloud(130-(cam*.08%1500),110,120);cloud(700-(cam*.11%1700),180,90);cloud(1160-(cam*.07%1850),90,105)}function platform(q){if(!q.t){x.fillStyle='#8b5a2b';x.fillRect(q.x,q.y,q.w,q.h);x.fillStyle='#3dbb52';x.fillRect(q.x,q.y,q.w,18);x.fillStyle='#70dc61';x.fillRect(q.x,q.y,q.w,7)}else{x.fillStyle=q.t===2?'#b46d33':'#d97932';rr(q.x,q.y,q.w,q.h,5);x.fill();x.fillStyle=q.t===2?'#4bc75b':'#f7a845';x.fillRect(q.x+3,q.y+3,q.w-6,8)}}function drawCoin(q){if(!q.on)return;x.save();x.translate(q.x+12,q.y+15);x.scale(.35+Math.abs(Math.sin(q.a))*.65,1);x.fillStyle='#ffd84d';x.beginPath();x.ellipse(0,0,12,15,0,0,7);x.fill();x.strokeStyle='#e59b16';x.lineWidth=4;x.stroke();x.restore()}function enemy(q){if(!q.on)return;x.save();x.translate(q.x,q.y);x.fillStyle='#6d3fa8';rr(0,7,46,41,13);x.fill();x.fillStyle='#fff';x.fillRect(10,17,9,13);x.fillRect(28,17,9,13);x.fillStyle='#21162f';x.fillRect(q.v>0?14:11,21,4,7);x.fillRect(q.v>0?32:29,21,4,7);x.restore()}function hero(){if(p.inv&&Math.floor(p.inv*12)%2===0)return;let run=Math.sin(p.a*3.2)*Math.min(1,Math.abs(p.vx)/220);x.save();x.translate(p.x+21,p.y+27);x.scale(p.face,1);x.rotate(clamp(p.vx/1600,-.16,.16));x.fillStyle='#263b72';rr(-16,3,32,31,8);x.fill();x.fillStyle='#ff6b35';rr(-18,-23,36,31,11);x.fill();
