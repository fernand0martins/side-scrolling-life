function goal(){rect(WORLD_W-24,91,3,60,'#f5f0df');rect(WORLD_W-21,94,18,10,'#e84d6b');rect(WORLD_W-17,97,2,2,'#fff')}
function drawHUD(){
 rect(4,4,112,18,'#0a1020');rect(5,5,110,16,'#18223b');ctx.fillStyle='#fff';ctx.font='bold 7px monospace';ctx.fillText('SIDE SCROLLING LIFE',9,12);ctx.fillStyle='#ffd447';ctx.fillText('SCORE '+String(score).padStart(5,'0'),9,19);ctx.fillStyle='#fff';ctx.fillText('LIVES '+Math.max(0,lives),73,19);
 const si=stageIndex(player.x);rect(211,4,105,18,'#0a1020');rect(212,5,103,16,'#18223b');ctx.fillStyle='#fff';ctx.fillText((si+1)+'/'+stages.length+' '+stages[si].title,216,12);rect(216,16,94,3,'#303c58');rect(216,16,94*clamp(player.x/WORLD_W,0,1),3,'#ffd447');
 if(banner>0){const alpha=clamp(banner<.4?banner/.4:banner>1.8?(2.2-banner)/.4:1,0,1);ctx.globalAlpha=alpha;rect(90,29,140,31,'#0a1020');rect(92,31,136,27,'#18223b');ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.fillText(stages[si].title,160,43);ctx.fillStyle='#ffd447';ctx.font='7px monospace';ctx.fillText(stages[si].sub,160,53);ctx.textAlign='left';ctx.globalAlpha=1}
 if(messageTime>0||state!=='play'){rect(73,67,174,49,'#0a1020');rect(76,70,168,43,'#18223b');ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 12px monospace';ctx.fillText(message,160,88);if(state!=='play'){ctx.fillStyle='#ffd447';ctx.font='8px monospace';ctx.fillText('FINAL SCORE '+score,160,101);ctx.fillStyle='#fff';ctx.font='6px monospace';ctx.fillText('ENTER / SPACE / R TO RESTART',160,110)}ctx.textAlign='left'}
}
function draw(){ctx.clearRect(0,0,W,H);staticBackground();ctx.save();ctx.translate(-snap(cam),0);for(const p of platforms)platform(p);for(const c of checkpoints)checkpoint(c);goal();for(const c of coins)coin(c);for(const e of enemies)enemy(e);girlNPC();hero();for(const p of particles)rect(p.x,p.y,p.size,p.size,p.color);ctx.restore();drawHUD()}
function frame(ts){const dt=Math.min((ts-last)/1000||0,.05);last=ts;acc+=dt;while(acc>=1/120){update(1/120);acc-=1/120}draw();requestAnimationFrame(frame)}
setTimeout(()=>document.querySelector('.tips').style.opacity='.35',7000);requestAnimationFrame(frame)
})();
</script>
</body>
