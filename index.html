(()=>{'use strict';

function drawCoin(q){if(!q.on)return;x.save();x.translate(q.x+12,q.y+15);x.scale(.35+Math.abs(Math.sin(q.a))*.65,1);x.fillStyle='#ffd84d';x.beginPath();x.ellipse(0,0,12,15,0,0,7);x.fill();x.strokeStyle='#e59b16';x.lineWidth=4;x.stroke();x.restore()}

function person(dx,dy,flip,body,hat,hair,small=false){const z=small?.88:1;x.save();x.translate(dx,dy);x.scale(flip*z,z);x.fillStyle='#263b72';rr(-15,3,30,30,8);x.fill();x.fillStyle=body;rr(-17,-23,34,31,11);x.fill();x.fillStyle='#ffd0a8';rr(-11,-17,22,22,8);x.fill();x.fillStyle=hair;x.fillRect(-12,-21,24,7);x.fillStyle='#172033';x.fillRect(5,-10,4,7);if(hat){x.fillStyle=hat;x.fillRect(-19,-25,36,8);x.fillRect(-14,-32,24,10)}x.strokeStyle='#172033';x.lineWidth=6;x.lineCap='round';const run=Math.sin(p.a*3.2)*Math.min(1,Math.abs(p.vx)/220);x.beginPath();x.moveTo(-8,28);x.lineTo(-11+run*7,39);x.moveTo(8,28);x.lineTo(11-run*7,39);x.stroke();x.restore()}
function hero(){if(p.inv&&Math.floor(p.inv*12)%2===0)return;const mode=spriteMode(),t=themeInfo(p.x).current;let boy='#ff6b35',girl='#ec5d8f',hat='#ffcf33';if(t==='spain'){boy='#d85b42';girl='#f2b84b'}if(t==='france'){boy='#305c91';girl='#db5c73'}if(t==='belgium'){boy='#35383d';girl='#d49c3d'}if(t==='amsterdam'){boy='#f2b632';girl='#45a0b5';hat='#233d5d'}if(t==='japan'){boy='#3b6aa0';girl='#e26b88';hat=null}if(t==='korea'){boy='#202636';girl='#865bd6';hat=null}if(mode==='finale'){boy='#20242b';girl='#f2eee4';hat=null}x.save();x.translate(p.x+21,p.y+27);x.scale(p.face,1);x.rotate(clamp(p.vx/1600,-.16,.16));if(mode==='boy'||mode==='meeting')person(0,0,1,boy,hat,'#633b24');else{person(-12,0,1,boy,hat,'#633b24',true);person(15,1,1,girl,null,'#4a2b25',true)}x.restore()}
function girlNPC(){if(metGirl)return;const gx=SEG+720;if(gx<cam-100||gx>cam+vw+100)return;x.save();x.translate(gx,GROUND-54);person(0,27,1,'#ec5d8f',null,'#4a2b25');x.fillStyle='#ff82ac';x.font='bold 25px system-ui';x.fillText('♥',-8,-40);x.restore()}
function checkpoint(q){x.strokeStyle='#f7f3df';x.lineWidth=7;x.beginPath();x.moveTo(q.x,610);x.lineTo(q.x,440);x.stroke();x.fillStyle=q.on?'#ffd84d':'#ef476f';x.beginPath();x.moveTo(q.x+4,442);x.lineTo(q.x+72,470);x.lineTo(q.x+4,498);x.fill()}
function draw(){x.save();x.scale(scale,scale);bg();x.save();x.translate(-cam,0);plats.forEach(platform);checks.forEach(checkpoint);coins.forEach(drawCoin);enemies.forEach(enemy);girlNPC();hero();for(const q of parts){x.fillStyle=q.c;x.fillRect(q.x,q.y,q.z,q.z)}x.restore();x.fillStyle='#0e1424d9';rr(20,20,350,68,14);x.fill();x.fillStyle='#fff';x.font='700 24px system-ui';x.fillText('SIDE SCROLLING LIFE',38,50);x.font='600 18px system-ui';x.fillStyle='#ffd84d';x.fillText('Score '+String(score).padStart(5,'0'),38,76);x.fillStyle='#fff';x.fillText('Lives '+'●'.repeat(Math.max(0,lives)),220,76);const ti=themeInfo(p.x),progress=clamp(p.x/WORLD_W,0,1);x.fillStyle='#0e1424c9';rr(vw-350,24,310,50,12);x.fill();x.fillStyle='#ffffff33';rr(vw-330,52,270,9,5);x.fill();x.fillStyle='#ffd84d';rr(vw-330,52,270*progress,9,5);x.fill();x.fillStyle='#fff';x.font='600 14px system-ui';x.fillText((ti.index+1)+' / '+stages.length+'  '+stages[ti.index].title,vw-330,43);if(stageBanner>0){const a=clamp(stageBanner<.5?stageBanner*2:stageBanner>2.2?(2.7-stageBanner)*2:1,0,1);x.globalAlpha=a;x.textAlign='center';x.fillStyle='#0e1424d9';rr(vw/2-240,105,480,92,18);x.fill();x.fillStyle='#fff';x.font='800 34px system-ui';x.fillText(stages[ti.index].title,vw/2,145);x.fillStyle='#ffd84d';x.font='600 17px system-ui';x.fillText(stages[ti.index].subtitle,vw/2,174);x.textAlign='left';x.globalAlpha=1}if(msgT||state!=='play'){x.textAlign='center';x.fillStyle='#0e1424e6';rr(vw/2-250,vh/2-80,500,160,20);x.fill();x.fillStyle='#fff';x.font='800 42px system-ui';x.fillText(msg,vw/2,vh/2-12);if(state!=='play'){x.fillStyle='#ffd84d';x.font='600 20px system-ui';x.fillText('Final score: '+score,vw/2,vh/2+28);x.fillStyle='#fff';x.font='500 17px system-ui';x.fillText('Press Enter, Space or R to restart',vw/2,vh/2+58)}x.textAlign='left'}x.restore()}
function frame(ts){const dt=Math.min((ts-last)/1000||0,.05);last=ts;acc+=dt;while(acc>=1/120){update(1/120);acc-=1/120}draw();requestAnimationFrame(frame)}setTimeout(()=>document.querySelector('#tips').style.opacity='.35',7000);requestAnimationFrame(frame);
})();
