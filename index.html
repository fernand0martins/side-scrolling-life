<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title></title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="shell">
 <canvas id="game" width="480" height="270"></canvas>
 <div id="hud-left" class="hud">
  <div id="game-title" class="hud-title"></div>
  <div class="hud-row">
   <span><span id="score-label"></span> <strong id="score">00000</strong></span>
   <span id="life-status" class="life-status" role="img" aria-label="3 lives remaining">
    <span id="lives-label"></span>
    <span id="hearts" class="hearts" aria-hidden="true">
     <span class="heart"></span><span class="heart"></span><span class="heart"></span>
    </span>
   </span>
   <strong id="lives" class="legacy-counter" aria-hidden="true">3</strong>
   <strong id="speed" class="legacy-counter" aria-hidden="true">0%</strong>
  </div>
 </div>
 <div id="hud-right" class="hud">
  <div class="hud-row"><strong id="stage-name"></strong><span id="stage-sub"></span></div>
  <div class="progress"><div id="progress-bar"></div></div>
 </div>
 <div id="banner"><div id="banner-title"></div><div id="banner-sub"></div></div>
 <div id="message"><div id="message-title"></div><div id="message-detail"></div><button id="restart-button" type="button"></button></div>
 <div id="fatal" role="alert"></div>
</div>
<div id="tips"></div>
<div class="pad left">
 <button data-key="left"><img src="icons/left.svg" alt="" draggable="false"></button>
 <button data-key="right"><img src="icons/right.svg" alt="" draggable="false"></button>
</div>
<div class="pad right">
 <button data-key="jump"><img src="icons/jump.svg" alt="" draggable="false"></button>
</div>
<script src="text.js"></script>
<script>
window.__SIDE_SCROLLING_LIFE_BOOTED__=false;
const T=window.GAME_TEXT;
document.title=T.title;
document.querySelector('#game-title').textContent=T.hud.gameTitle;
document.querySelector('#score-label').textContent=T.hud.score;
document.querySelector('#lives-label').textContent=T.hud.lives;
document.querySelector('#tips').textContent=T.controls.tips;
const livesCounter=document.querySelector('#lives');
const lifeStatus=document.querySelector('#life-status');
const heartSlots=[...document.querySelectorAll('#hearts .heart')];
function syncHearts(){
 const remaining=Math.max(0,Math.min(3,Number.parseInt(livesCounter.textContent,10)||0));
 heartSlots.forEach((heart,index)=>heart.classList.toggle('empty',index>=remaining));
 lifeStatus.setAttribute('aria-label',`${remaining} ${remaining===1?'life':'lives'} remaining`);
}
new MutationObserver(syncHearts).observe(livesCounter,{childList:true,characterData:true,subtree:true});
syncHearts();
const restartButton=document.querySelector('#restart-button');
const resultMessage=document.querySelector('#message');
restartButton.textContent=T.controls.restart;
restartButton.setAttribute('aria-label',T.controls.restart);
restartButton.addEventListener('pointerdown',event=>event.stopImmediatePropagation());
restartButton.addEventListener('click',event=>{
 event.preventDefault();
 event.stopImmediatePropagation();
 window.dispatchEvent(new KeyboardEvent('keydown',{code:'KeyR',key:'r',bubbles:true}));
 restartButton.classList.remove('show');
});
function syncRestartButton(){
 const terminalState=window.__SIDE_SCROLLING_LIFE__?.getState?.().state;
 const terminal=terminalState==='over'||terminalState==='win';
 restartButton.classList.toggle('show',terminal);
 if(terminal)resultMessage.classList.add('show');
}
window.setInterval(syncRestartButton,100);
const controlButtons=document.querySelectorAll('.pad button');
controlButtons[0].setAttribute('aria-label',T.controls.moveLeft);
controlButtons[1].setAttribute('aria-label',T.controls.moveRight);
controlButtons[2].setAttribute('aria-label',T.controls.jump);
const firstStage=T.stages[0];
document.querySelector('#stage-name').textContent=`1 / ${T.stages.length} · ${firstStage.title}`;
document.querySelector('#stage-sub').textContent=firstStage.sub;
document.querySelector('#banner-title').textContent=firstStage.title;
document.querySelector('#banner-sub').textContent=firstStage.sub;
const fatal=document.querySelector('#fatal');
fatal.textContent=T.errors.startup;
window.addEventListener('error',event=>{
 if(fatal){fatal.textContent=T.errors.startupWithReason(event.message||T.errors.unknown);fatal.classList.add('show')}
});
window.setTimeout(()=>{
 if(!window.__SIDE_SCROLLING_LIFE_BOOTED__&&fatal)fatal.classList.add('show');
},2000);
</script>
<script src="visual-style.js"></script>
<script src="game-core.js"></script>
<script src="game-world.js"></script>
<script src="game-render.js"></script>
<script>
// Terminal wedding messages stay open until the player explicitly restarts.
const originalBeginCelebration=beginCelebration;
beginCelebration=function(){
 originalBeginCelebration();
 if(state==='win'){
  messageTime=Infinity;
  resultMessage.classList.add('show');
 }
};
// Replace the raised-hand detail with compact closed fists.
drawThrillerDancer=function(){
 if(state!=='win')return;
 const entrance=clamp(celebrationClock/3,0,1),x=FINISH_X-520+entrance*225,y=GROUND-30,bounce=Math.sin(celebrationClock*9)*1.2,posed=entrance>=1;
 ctx.save();ctx.translate(snap(x),snap(y+bounce));
 rect(-5,-14,10,8,'#a96d4c');rect(-7,-18,14,6,'#17181d');rect(-5,-12,10,2,'#17181d');rect(-2,-10,4,2,'#f2eee8');
 poly([[-10,-8],[10,-8],[9,10],[-9,10]],'#d52d35');rect(-7,-6,3,14,'#17181d');rect(4,-6,3,14,'#17181d');rect(-2,-7,4,16,'#9e1d27');
 rect(-8,10,7,15,'#c92b34');rect(1,10,7,15,'#c92b34');rect(-8,24,8,4,'#f1eee5');rect(1,24,8,4,'#f1eee5');rect(-10,27,10,3,'#17181d');rect(1,27,10,3,'#17181d');
 if(posed){line(-8,-5,-17,-22,4,'#d52d35');line(8,-5,17,-22,4,'#d52d35');rect(-20,-26,7,6,'#a96d4c');rect(13,-26,7,6,'#a96d4c');rect(-19,-25,5,2,'#7d4935');rect(14,-25,5,2,'#7d4935')}
 else{const swing=Math.sin(celebrationClock*10)*5;line(-8,-5,-13,6+swing,4,'#d52d35');line(8,-5,13,6-swing,4,'#d52d35')}
 ctx.restore();
};
</script>
</body>
</html>
